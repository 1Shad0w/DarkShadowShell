name: Release and Tag

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Version tag name (e.g. v6.84)"
        required: true
        type: string
      create_release:
        description: "Create a GitHub Release in addition to the tag"
        required: true
        default: true
        type: boolean
      prerelease:
        description: "Mark the release as a pre-release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  tag-and-release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'dev')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag and release options
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
          INPUT_TAG: ${{ inputs.tag_name }}
          INPUT_RELEASE: ${{ inputs.create_release }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys

          event = os.environ["EVENT_NAME"]
          tag = ""
          create_release = False
          prerelease = False

          if event == "workflow_dispatch":
              tag = os.environ.get("INPUT_TAG", "").strip()
              create_release = os.environ.get("INPUT_RELEASE", "true").lower() == "true"
              prerelease = os.environ.get("INPUT_PRERELEASE", "false").lower() == "true"
          else:
              body = os.environ.get("PR_BODY", "")
              m = re.search(r"(?im)^[ \t>*-]*(?:Version\s*tag|Tag|Version)\s*:\s*(.+?)\s*$", body)
              if m:
                  cand = m.group(1).strip().strip("`\"'")
                  if cand and not cand.startswith("<!--"):
                      tag = cand
              if not tag:
                  ver = open("VERSION").read().strip()
                  if ver:
                      tag = ver if ver.startswith("v") else "v" + ver

              if re.search(r"(?im)-\s*\[x\]\s*Create\s+GitHub\s+Release", body) or \
                 re.search(r"(?im)^[ \t>*-]*Create\s+GitHub\s+Release\s*:\s*(yes|true)\s*$", body):
                  create_release = True

          if not tag:
              print("No version tag resolved", file=sys.stderr)
              sys.exit(1)

          chk = subprocess.run(["git", "check-ref-format", f"refs/tags/{tag}"])
          if chk.returncode != 0:
              print(f"Invalid tag name: {tag}", file=sys.stderr)
              sys.exit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"tag={tag}\n")
              out.write(f"create_release={'true' if create_release else 'false'}\n")
              out.write(f"prerelease={'true' if prerelease else 'false'}\n")
          print(f"Resolved tag={tag}, create_release={create_release}, prerelease={prerelease}")
          PY

      - name: Create and push git tag
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists; skipping tag creation."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "refs/tags/$TAG"
          fi

      - name: Create GitHub Release
        if: steps.meta.outputs.create_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
          else
            args=("$TAG" --title "$TAG" --generate-notes)
            if [ "$PRERELEASE" = "true" ]; then
              args+=(--prerelease)
            fi
            gh release create "${args[@]}"
          fi
